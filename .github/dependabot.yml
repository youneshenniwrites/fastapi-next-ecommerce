version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    assignees: [youneshenniwrites]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-patches:
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: github-actions
    directory: /
    assignees: [youneshenniwrites]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /backend
    assignees: [youneshenniwrites]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /frontend
    assignees: [youneshenniwrites]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      frontend-patches:
        update-types: ["patch"]
