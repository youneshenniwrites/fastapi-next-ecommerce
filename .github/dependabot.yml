version: 2
# Minor and patch updates share one weekly PR per ecosystem so each needs one
# Codex review; majors stay separate because they need individual attention.
updates:
  - package-ecosystem: uv
    directory: /backend
    exclude-paths: ["requirements.txt"]
    assignees: [youneshenniwrites]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    assignees: [youneshenniwrites]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /backend
    assignees: [youneshenniwrites]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /frontend
    assignees: [youneshenniwrites]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
