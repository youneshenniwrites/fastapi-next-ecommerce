name: Frontend CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect docs-only changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            printf 'docs_only=%s\n' "false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files=$(git diff --name-only "$BASE_SHA...HEAD") || exit 1
          if printf '%s\n' "$changed_files" | grep -qvE '(\.md$|^\.agents/skills/)'; then
            printf 'docs_only=%s\n' "false" >> "$GITHUB_OUTPUT"
          else
            printf 'docs_only=%s\n' "true" >> "$GITHUB_OUTPUT"
          fi
  quality:
    name: Frontend · Lint, types, contract and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Set up Python for API contract export
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.22"
      - name: Install locked API dependencies
        run: uv sync --locked --python 3.12 --project ../backend
      - name: Export and verify the FastAPI contract
        run: |
          cd ../backend
          uv run python -m scripts.export_openapi
          cd ../frontend
          npm run api:check
      - name: Check formatting
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
      - name: Check TypeScript and route types
        run: npm run typecheck
      - name: Run unit tests and enforce coverage
        id: coverage_tests
        run: npm test
      - name: Audit frontend dependencies
        run: python3 ../scripts/frontend_audit.py
      - name: Upload frontend unit coverage
        id: coverage_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-unit-coverage
          path: frontend/coverage
          retention-days: 14
      - name: Summarize measured frontend coverage
        if: always()
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage_tests.outcome }}
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage_artifact.outputs.artifact-url }}
        run: >-
          python3 ../scripts/coverage_summary.py --kind frontend --report coverage/lcov.info
          --outcome "$COVERAGE_OUTCOME" --artifact-url "$COVERAGE_ARTIFACT_URL"
          >> "$GITHUB_STEP_SUMMARY"
  browser_shards:
    name: Frontend · Browser shard ${{ matrix.shard }}/3
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      # Match the locked Playwright SDK; keep tag and immutable digest together.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build the production storefront
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Set up Python for real API integration tests
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.22"
      - name: Install locked API dependencies
        run: uv sync --locked --python 3.12 --project ../backend
      - name: Verify the locked SDK can launch preinstalled Chromium
        run: |
          node --input-type=module <<'JS'
          import { createRequire } from 'node:module';
          import { chromium } from 'playwright';
          const { version } = createRequire(import.meta.url)('playwright/package.json');
          if (version !== '1.63.0') {
            throw new Error('Update the pinned Playwright image together with the SDK');
          }
          const browser = await chromium.launch();
          console.log(`Preinstalled Chromium ready: ${browser.version()}`);
          await browser.close();
          JS
      - name: Test desktop, mobile, accessibility and failure states
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --reporter=list,blob,html
      - name: Upload browser report, screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-browser-evidence-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
      - name: Upload mergeable browser report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-browser-blob-${{ matrix.shard }}
          path: frontend/blob-report/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Package the standalone build
        if: matrix.shard == 1
        run: tar -czf storefront-build.tar.gz -C .next/standalone .
      - name: Upload candidate storefront build
        if: matrix.shard == 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storefront-build-candidate
          path: frontend/storefront-build.tar.gz
          retention-days: 14

  browser:
    # Keep the existing protected check, and never let failed/skipped shards pass it.
    name: Frontend · Production build and browser tests
    needs: [changes, browser_shards]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every browser shard to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHARDS_RESULT: ${{ needs.browser_shards.result }}
        run: |
          test "$CHANGES_RESULT" = success && test "$SHARDS_RESULT" = success
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: frontend-browser-blob-*
          path: frontend/blob-reports
          merge-multiple: true
      - name: Download candidate build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: storefront-build-candidate
          path: frontend
      - name: Require complete reports and candidate build
        run: |
          test "$(find frontend/blob-reports -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          test -s frontend/storefront-build.tar.gz
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Merge browser reports
        working-directory: frontend
        run: npx --no-install playwright merge-reports --reporter=html blob-reports
      - name: Upload combined browser report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-browser-evidence
          path: frontend/playwright-report
          if-no-files-found: error
          retention-days: 14
      - name: Publish validated storefront build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storefront-build
          path: frontend/storefront-build.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Summarize browser validation
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          All three isolated browser shards passed. The combined report and validated standalone build are attached.
          Each shard retains one worker and the existing retries and privacy settings.
          Deployment remains separate and requires the whole exact-main verification workflow to succeed.
          EOF
