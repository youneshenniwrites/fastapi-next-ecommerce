name: Frontend CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect docs-only changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            printf 'docs_only=%s\n' "false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files=$(git diff --name-only "$BASE_SHA...HEAD") || exit 1
          if printf '%s\n' "$changed_files" | grep -qvE '(\.md$|^\.agents/skills/)'; then
            printf 'docs_only=%s\n' "false" >> "$GITHUB_OUTPUT"
          else
            printf 'docs_only=%s\n' "true" >> "$GITHUB_OUTPUT"
          fi
  quality:
    name: Frontend · Lint, types, contract and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Set up Python for API contract export
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.8.22"
      - name: Install locked API dependencies
        run: uv sync --locked --python 3.12 --project ../backend
      - name: Export and verify the FastAPI contract
        run: |
          cd ../backend
          uv run python -m scripts.export_openapi
          cd ../frontend
          npm run api:check
      - name: Check formatting
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
      - name: Check TypeScript and route types
        run: npm run typecheck
      - name: Run unit tests and enforce coverage
        id: coverage_tests
        run: npm test
      - name: Audit frontend dependencies
        run: npm audit
      - name: Upload frontend unit coverage
        id: coverage_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-unit-coverage
          path: frontend/coverage
          retention-days: 14
      - name: Summarize measured frontend coverage
        if: always()
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage_tests.outcome }}
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage_artifact.outputs.artifact-url }}
        run: >-
          python3 ../scripts/coverage_summary.py --kind frontend --report coverage/lcov.info
          --outcome "$COVERAGE_OUTCOME" --artifact-url "$COVERAGE_ARTIFACT_URL"
          >> "$GITHUB_STEP_SUMMARY"
  browser:
    name: Frontend · Production build and browser tests
    needs: [quality, changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build the production storefront
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Set up Python for real API integration tests
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.8.22"
      - name: Install locked API dependencies
        run: uv sync --locked --python 3.12 --project ../backend
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium and browser system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test desktop, mobile, accessibility and failure states
        run: npm run test:e2e
      - name: Upload browser report, screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
      - name: Package the standalone build
        run: tar -czf storefront-build.tar.gz -C .next/standalone .
      - name: Upload validated storefront build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storefront-build
          path: frontend/storefront-build.tar.gz
          retention-days: 14
      - name: Summarize build and deployment status
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Storefront delivery
          See the named checks above for build and browser-test results.
          Successful runs publish the standalone build and browser evidence as artifacts.
          **Deployment: separate workflow.** This workflow validates and packages the frontend.
          Production delivery deploys verified main commits to Vercel and runs smoke checks.
          Frontend PR previews remain tracked in #45.
          EOF
