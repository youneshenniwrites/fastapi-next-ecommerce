name: Backend CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
  issues: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect docs-only changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            printf 'docs_only=%s\n' "false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files=$(git diff --name-only "$BASE_SHA...HEAD") || exit 1
          if printf '%s\n' "$changed_files" | grep -qvE '(\.md$|^\.agents/skills/)'; then
            printf 'docs_only=%s\n' "false" >> "$GITHUB_OUTPUT"
          else
            printf 'docs_only=%s\n' "true" >> "$GITHUB_OUTPUT"
          fi
  backend:
    name: Backend · Lint, contract and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate issue-linked branch name
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_branch_name.py
      - name: Set up Python dependency tooling
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --locked --python 3.12
      - name: Run Ruff lint
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Verify lockfile and requirements consistency
        run: uv run python scripts/check_requirements.py
      - name: Run backend tests and enforce coverage
        id: coverage_tests
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Upload coverage report
        id: coverage_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize measured backend coverage
        if: always()
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage_tests.outcome }}
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage_artifact.outputs.artifact-url }}
        run: >-
          python ../scripts/coverage_summary.py --kind backend --report coverage.xml
          --outcome "$COVERAGE_OUTCOME" --artifact-url "$COVERAGE_ARTIFACT_URL"
          >> "$GITHUB_STEP_SUMMARY"
  container:
    name: Backend · Container build and migration smoke tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate disposable CI configuration
        run: python3 backend/scripts/dev_setup.py
      - name: Build containers, apply migrations and wait for health
        run: docker compose --env-file backend/.env up --build --wait --wait-timeout 180
      - name: Test API authentication and authorization
        run: python3 backend/scripts/smoke.py
      - name: Verify database schema matches migrations
        run: docker compose --env-file backend/.env exec -T api alembic check
      - name: Check migration rollback on disposable database
        run: |
          docker compose --env-file backend/.env stop api
          docker compose --env-file backend/.env run --rm migrate alembic downgrade base
          docker compose --env-file backend/.env run --rm migrate alembic upgrade head
          docker compose --env-file backend/.env run --rm migrate alembic check
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file backend/.env logs
      - name: Cleanup disposable CI resources
        if: always()
        run: docker compose --env-file backend/.env down --volumes
  postgres:
    name: Backend · PostgreSQL integration tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python dependency tooling
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --locked --python 3.12
      - name: Create separate disposable migration database
        run: |
          uv run python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://ecommerce:ci-only-password@localhost:5432/ecommerce_test", autocommit=True) as connection:
              connection.execute("CREATE DATABASE ecommerce_migrations")
          PY
      - name: Run full test suite against PostgreSQL
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ecommerce:ci-only-password@localhost:5432/ecommerce_test
          TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://ecommerce:ci-only-password@localhost:5432/ecommerce_migrations
