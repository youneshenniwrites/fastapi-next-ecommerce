name: Dependabot continuation
on:
  workflow_run:
    workflows: [Backend CI, Frontend CI, PR coverage comparison, Dependency audit, Branch naming, Review gate tests, Codex review gate, Dependabot approval and auto-merge]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependabot-protected-merge
  cancel-in-progress: false
jobs:
  reconcile:
    # Gate polling catches reaction-only evidence; transition-only optimization is VIN-147.
    if: github.repository == 'youneshenniwrites/fastapi-next-ecommerce'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: write
      checks: read
      statuses: read
    steps:
      # Never checkout event head, execute PR code, or consume run artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install trusted export tool (no PR dependencies)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.22"
          enable-cache: false
      - name: Reconcile live dependency PR evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDABOT_REVIEW_TOKEN: ${{ secrets.DEPENDABOT_REVIEW_TOKEN }}
        run: python3 scripts/dependabot_reconcile.py
