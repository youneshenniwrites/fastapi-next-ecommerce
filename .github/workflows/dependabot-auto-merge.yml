name: Dependabot approval and auto-merge
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
concurrency:
  group: dependabot-protected-merge
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'youneshenniwrites/fastapi-next-ecommerce' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: write
      checks: read
      statuses: read
    steps:
      # Never checkout event head, execute PR code, or consume run artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install trusted export tool (no PR dependencies)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.22"
          enable-cache: false
      - name: Reconcile live dependency PR evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDABOT_REVIEW_TOKEN: ${{ secrets.DEPENDABOT_REVIEW_TOKEN }}
        run: python3 scripts/dependabot_reconcile.py
