[project]
name = "fastapi-next-ecommerce-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn[standard]>=0.54.0,<1",
  "sqlalchemy>=2.0.54,<2.1",
  "alembic>=1.19.2,<2",
  "psycopg[binary]>=3.3.6,<4",
  "pydantic[email]>=2.13.5,<3",
  "pydantic-settings>=2.7.1,<3",
  "python-multipart>=0.0.20,<1",
  "pyjwt>=2.14.0,<3",
  "pwdlib[argon2,bcrypt]>=0.3.1,<1",
  "structlog>=24.4.0,<27",
  "sentry-sdk>=2.69.2,<3",
  "stripe>=15.4.0,<16",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<10",
    "httpx>=0.28,<1",
    "ruff>=0.16.10,<1",
    "pip-audit>=2.9,<3",
    "pytest-cov>=6,<8",
    "pre-commit>=4,<5",
    "mypy==2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["app/services/orders.py", "app/services/payments.py", "app/providers/stripe.py", "app/providers/payment_types.py"]
strict = true
disallow_any_explicit = true
show_error_codes = true
warn_unused_configs = true
# Follow imported types without turning this bounded gate into a repository-wide
# migration. Explicit files above remain fully checked; imports are not skipped.
follow_imports = "silent"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
precision = 1
