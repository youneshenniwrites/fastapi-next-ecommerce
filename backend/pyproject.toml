[project]
name = "fastapi-next-ecommerce-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn[standard]>=0.52.4,<1",
  "sqlalchemy>=2.0.52,<2.1",
  "alembic>=1.19.2,<2",
  "psycopg[binary]>=3.3.5,<4",
  "pydantic[email]>=2.13.5,<3",
  "pydantic-settings>=2.7.1,<3",
  "python-multipart>=0.0.20,<1",
  "pyjwt>=2.13.0,<3",
  "pwdlib[argon2,bcrypt]>=0.3.1,<1",
  "structlog>=24.4.0,<27",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<10",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
    "pip-audit>=2.9,<3",
    "pytest-cov>=6,<8",
    "pre-commit>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
precision = 1
